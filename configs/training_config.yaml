augmentation:     
  rotation: [-5.0, 5.0]             # degrees
  translation: [-0.1, 0.1]          # percentage of the image
  scaling: [0.9, 1.1]               # factor
  shear: [-5.0, 5.0]                # degrees
  gaussian_noise: [0.01, 0.03]      # fraction of max value
  brightness: [-0.2, 0.2]           # variation range
  contrast: [-0.2, 0.2]             # variation range
  gaussian_blur_sigma: [0.2, 0.6]   # range of sigma

normalization:
  mean: [0.485, 0.456, 0.406]       # ImageNet per-channel mean (RGB) 
  std: [0.229, 0.224, 0.225]        # ImageNet per-channel std (RGB) 
  max_pixel_value: 255.0            # Max value used to scale to [0,1] before applying mean/std 

dataloader:
  batch_size: 32
  num_workers: 4

model:
  num_classes: 3

metrics:
  bacteria_label_idx: 1             # Index of the bacteria-infected samples label

hyperparameters:
  dropout: 0.4

  optimizer: AdamW
  lr_phase1: 1e-3
  lr_phase2: 1e-4
  weight_decay: 1e-4

  lr_scheduler_patience: 5
  lr_es_patience: 10

  max_epochs_phase1: 15
  max_epochs_phase2: 50

  unfreeze_stages: 2

training:
  name: "baseline"
  amp: True

