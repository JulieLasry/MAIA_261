augmentation:     
  horizontal_flip: 0.5         # probability         
  rotation: [-15.0, 15.0]      # degrees
  translation: [-0.1, 0.1]     # percentage of the image
  scaling: [0.9, 1.1]          # factor
  shear: [-5.0, 5.0]           # degrees
  gaussian_noise: [0.1, 0.2]   # fraction of max value
  brightness: [-0.2, 0.2]      # variation range
  contrast: [-0.2, 0.2]        # variation range

normalization:
  mean: [0.485, 0.456, 0.406]  # ImageNet per-channel mean (RGB) 
  std: [0.229, 0.224, 0.225]   # ImageNet per-channel std (RGB) 
  max_pixel_value: 255.0       # Max value used to scale to [0,1] before applying mean/std 
